<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora de Peso UCI</title>
<style>
    body { font-family: Arial, sans-serif; text-align: center; background-color: #f5f8ff; }
    h1 { color: #003366; }
    table { margin: auto; border-collapse: collapse; }
    td { padding: 10px; }
    input, select { width: 150px; text-align: center; }
    .result { background-color: #e6ffe6; font-weight: bold; }
    .input { background-color: #fff9c4; }
</style>
</head>
<body>
    <h1>Calculadora de Peso para Balance Hídrico</h1>
    <p>Unidad de Cuidados Intensivos – Hospital Honorio Delgado</p>

    <table border="1">
        <tr>
            <td>Sexo:</td>
            <td>
                <select id="sexo" class="input">
                    <option value="varon">Varón</option>
                    <option value="mujer">Mujer</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Talla (cm):</td>
            <td><input id="tallaCm" type="number" class="input"></td>
        </tr>
        <tr>
            <td>Peso actual (kg):</td>
            <td><input id="pesoActual" type="number" class="input"></td>
        </tr>
        <tr>
            <td>Condición clínica:</td>
            <td>
                <select id="condicion" class="input">
                    <option value="sinDistress">Sin distress respiratorio</option>
                    <option value="insufResp">Insuficiencia respiratoria</option>
                </select>
            </td>
        </tr>
        <tr>
            <td colspan="2"><button onclick="calcular()">Calcular</button></td>
        </tr>
        <tr>
            <td>IMC:</td>
            <td class="result" id="imc"></td>
        </tr>
        <tr>
            <td>Peso Ideal (PI):</td>
            <td class="result" id="pi"></td>
        </tr>
        <tr>
            <td>Peso Ajustado (PA):</td>
            <td class="result" id="pa"></td>
        </tr>
        <tr>
            <td>Peso a usar:</td>
            <td class="result" id="pesoUsar"></td>
        </tr>
    </table>

    <script>
        function calcular() {
            let sexo = document.getElementById('sexo').value;
            let tallaCm = parseFloat(document.getElementById('tallaCm').value);
            let pesoActual = parseFloat(document.getElementById('pesoActual').value);
            let condicion = document.getElementById('condicion').value;

            if (isNaN(tallaCm) || isNaN(pesoActual)) {
                alert("Por favor ingrese valores válidos.");
                return;
            }

            let tallaM = tallaCm / 100;
            let imc = pesoActual / (tallaM * tallaM);

            let pi = 0;
            if (condicion === "sinDistress") {
                pi = (sexo === "varon") ? (tallaM * tallaM * 23) : (tallaM * tallaM * 21.5);
            } else if (condicion === "insufResp") {
                pi = (sexo === "varon") ? ((tallaCm - 152.4) * 0.91 + 50) : ((tallaCm - 152.4) * 0.91 + 45.5);
            }

            let pa = pi + 0.25 * (pesoActual - pi);

            let pesoUsar = "";
            if (imc > 30) {
                pesoUsar = pi.toFixed(1) + " kg (PI)";
            } else if (imc < 18.5) {
                pesoUsar = pa.toFixed(1) + " kg (PA)";
            } else {
                pesoUsar = pesoActual.toFixed(1) + " kg (PR)";
            }

            document.getElementById('imc').innerText = imc.toFixed(1);
            document.getElementById('pi').innerText = pi.toFixed(1) + " kg";
            document.getElementById('pa').innerText = pa.toFixed(1) + " kg";
            document.getElementById('pesoUsar').innerText = pesoUsar;
        }
    </script>
</body>
</html>
